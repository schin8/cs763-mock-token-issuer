name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit and HTTP tests
        run: python -m pytest tests/ -q
      - name: Check negative tokens against PyJWT
        run: python tests/verify_with_pyjwt.py
